name: Neurix Hub Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - '*.txt'
      - 'installer.iss'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Install pinned dependencies
        shell: pwsh
        run: python -m pip install -r requirements-lock.txt

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -p "test_*.py" -v

      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name NeurixHub-Alpha-0.4 --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtMultimedia neurix_hub.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          if (!(Test-Path 'dist/NeurixHub-Alpha-0.4/NeurixHub-Alpha-0.4.exe')) { throw 'Missing executable' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$iscc) { throw 'Inno Setup compiler not found' }
          & $iscc 'installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          if (!(Test-Path 'release/NeurixHub-Alpha-0.4-Setup.exe')) { throw 'Installer missing' }

      - name: Record SHA-256
        shell: pwsh
        run: |
          Get-FileHash 'release/NeurixHub-Alpha-0.4-Setup.exe' -Algorithm SHA256 | Format-List | Out-File 'release/SHA256.txt'

      - name: Upload private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeurixHub-Alpha-0.4-Windows-Unsigned
          path: |
            release/NeurixHub-Alpha-0.4-Setup.exe
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 7
